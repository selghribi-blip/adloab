# ============================================================
#  إعدادات التنبيهات
# ============================================================
#  ⚠️ قاعدة أمنية: لا تضع رمز بوت Telegram في هذا الملف إن كان المستودع عامًّا.
#  الأفضل: ضع التوكن ورقم المحادثة في متغيرات البيئة (لها الأولوية على هذا الملف):
#
#      export TELEGRAM_BOT_TOKEN="123456:AA..."     # من @BotFather
#      export TELEGRAM_CHAT_ID="123456789"          # من @userinfobot
#
#  أو في ملف .env (مستبعد من Git) ثم:  set -a; source .env; set +a
#  أو في GitHub: Settings → Secrets and variables → Actions
# ============================================================

enabled: true

telegram:
  bot_token: ""          # اتركه فارغًا واستخدم TELEGRAM_BOT_TOKEN
  chat_id: ""            # اتركه فارغًا واستخدم TELEGRAM_CHAT_ID
  silent: false          # true = تنبيهات صامتة بلا صوت على الجوال
  message_thread_id: ""  # للقروبات ذات المواضيع (اختياري)

webhook:
  # أي Webhook عام: Slack / Discord / Ntfy / Telegram-webhook
  # تجاوز القيمة بالمتغير ALERT_WEBHOOK_URL
  url: ""

# ------------------------------------------------------------
#  متى نُنبّه؟
# ------------------------------------------------------------

# تنبيه إن تجاوز زمن الاستجابة هذا الحد بالمللي ثانية (0 = معطّل)
# مثال: 2000 = نبّهني إن صار الموقع أبطأ من ثانيتين
latency_alert_ms: 0

# عدد المرات المتتالية لتجاوز حد البطء قبل التنبيه (يمنع الإزعاج من ارتفاع عابر)
latency_consecutive: 3

# تنبيه قبل انتهاء شهادة SSL بهذا العدد من الأيام
tls_warn_days: 7

# فترة التهدئة لكل نوع تنبيه (بالثواني) — تمنع إغراقك بالرسائل
cooldown_seconds:
  down: 0        # التوقف: فوري (مرة واحدة لكل حادثة)
  up: 0          # العودة للعمل: فورية
  slow: 1800     # البطء: مرة كل 30 دقيقة لكل هدف
  tls: 86400     # الشهادة: مرة كل يوم
